<app-search-bar (titleChange)="onSearch($event)" />

<div class="grid" *ngIf="movies().length > 0; else empty">
  @for (m of movies(); track m.id) {
    <a [routerLink]="['/movie', m.id]">
      @if (m.poster_path) {
        <img [src]="service.imgUrl + m.poster_path" [alt]="m.title" />
      } @else {
        <div class="noposter">Pas d'affiche</div>
      }
      <div class="title">{{ m.title }}</div>
    </a>
  }
</div>

<ng-template #empty><p class="empty">Aucun film trouvé.</p></ng-template>
